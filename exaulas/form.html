<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Formulário</title>
  </head>
  <body>
    <h1>Formulário em HTML</h1>

    <form method="post">
      <fieldset>
        <legend>Login</legend>
        <label for="nome">Nome:</label>
        <input
          type="text"
          name="nome"
          id="nome"
          placeholder="Digite o seu nome"
          required
        />
        <br />
        <br />

        <label for="senha">Senha:</label>
        <input
          type="password"
          name="senha"
          id="senha"
          placeholder="Digite sua senha"
        />
      </fieldset>
      <br /><label for="tel">Telefone:</label>
      <input
        type="tel"
        name="tel"
        id="tel"
        placeholder="Informe seu telefone"
      />
      <br />
      <br />
      <select name="category" id="input-category">
        <option value="">Selecione...</option>
        <option value="eletronicos">Eletrônicos</option>
        <option value="moda">Moda</option>
        <option value="ti" >Tecnologia</option>
      </select>

      <br /><br />
      <input type="radio" name="client-type" id="radio-pf" value="pf" >
      <label for="radio-pf">Pessoa fisica</label>
      <br>
      <input type="radio" name="client-type" id="radio-pj" value="pj" >
      <label for="radio-pf">Pessoa Juridica</label>
    </form>
  </body>
</html>
